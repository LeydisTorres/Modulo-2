<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Escreva seu CSS Aqui */
    .flag {
  width: 900px;
  height: 600px;
  background-color: #ce1126; /* vermelho */
  position: relative;
}

/* texto de cima */
.flag > p {
  color: white;
  font-size: 60px;
  text-align: center;
  margin: 0;
  padding-top: 20px;
}

/* faixa azul */
.flag > div {
  width: 900px;
  height: 300px;
  background-color: #002868;
  position: absolute;
  top: 150px;
}

/* círculo branco */
.flag > div > div {
  width: 200px;
  height: 200px;
  background-color: white;
  border-radius: 50%;
  position: relative;
  top: 50px;
  left: 350px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* texto dentro do círculo */
.flag > div > div p {
  margin: 0;
  font-size: 30px;
  text-align: center;
  color: black;
}
  
    
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
